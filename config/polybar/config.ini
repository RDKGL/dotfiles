[colors]
background = #111111
background-alt = #1f2937
foreground = #e5e7eb
primary = #10b981
secondary = #6b7280
alert = #ef4444
disabled = #374151

[bar/main]
width = 100%
height = 28pt
radius = 0

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt
padding-left = 1
padding-right = 1
module-margin = 1

separator = |
separator-foreground = ${colors.disabled}

# Подключение JetBrainsMono Nerd Font
font-0 = "JetBrainsMono Nerd Font:style=Regular:size=10;2"
font-1 = "JetBrainsMono Nerd Font:style=Bold:size=11;2"

# Расположение модулей:
# Слева: только чистые цифры рабочих столов
# По центру: дата и время
# Справа: раскладка, ЦП, ОЗУ, громкость, системный трей
modules-left = xworkspaces
modules-center = date
modules-right = xkeyboard cpu memory pulseaudio tray

cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true

# ==========================================
# Модули
# ==========================================

# 1. Рабочие столы (Строго чистые цифры 1, 2, 3...)
[module/xworkspaces]
type = internal/xworkspaces

label-active = %index%
label-active-background = ${colors.background-alt}
label-active-underline = ${colors.primary}
label-active-padding = 2

label-occupied = %index%
label-occupied-padding = 2
label-occupied-foreground = ${colors.foreground}

label-urgent = %index%
label-urgent-background = ${colors.alert}
label-urgent-padding = 2

label-empty = %index%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 2

# 2. Дата и Время (По центру)
[module/date]
type = internal/date
interval = 1

date = %d.%m.%Y %H:%M
date-alt = %A, %d %B %Y %H:%M:%S

label = 󰥔 %date%
label-foreground = ${colors.primary}
label-font = 2

# 3. Раскладка клавиатуры
[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock

label-layout = 󰌌 %layout%
label-layout-foreground = ${colors.primary}

# 4. Нагрузка ЦП (CPU)
[module/cpu]
type = internal/cpu
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%

# 5. Нагрузка ОЗУ (RAM)
[module/memory]
type = internal/memory
interval = 2
format-prefix = "  "
format-prefix-foreground = ${colors.primary}
label = %percentage_used:2%%

# 6. Громкость
[module/pulseaudio]
type = internal/pulseaudio
format-volume-prefix = "󰕾 "
format-volume-prefix-foreground = ${colors.primary}
format-volume = <label-volume>
label-volume = %percentage%%

label-muted = "󰝟 muted"
label-muted-foreground = ${colors.disabled}

# 7. Системный трей (Steam, Discord, Telegram)
[module/tray]
type = internal/tray
tray-spacing = 8px
tray-size = 16px
