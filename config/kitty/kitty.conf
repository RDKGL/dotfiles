# ==========================================
# Kitty Terminal Configuration (Solid Emerald)
# ==========================================

font_family      monospace
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        10.5

# Сплошной фон без прозрачности
background_opacity 1.0

# Интерфейс и отступы
window_padding_width 12
hide_window_decorations yes
confirm_os_window_close 0

# Цветовая палитра (Dark + Emerald #10b981)
background           #0e141b
foreground           #e2e8f0
cursor               #10b981
cursor_text_color    #0e141b

# Выделение текста
selection_background #1e293b
selection_foreground #ffffff

# Цвета (ANSI 16)
color0               #1e293b
color8               #475569
color1               #ef4444
color9               #f87171
color2               #10b981
color10              #34d399
color3               #f59e0b
color11              #fbbf24
color4               #3b82f6
color12              #60a5fa
color5               #8b5cf6
color13              #a78bfa
color6               #06b6d4
color14              #22d3ee
color7               #f1f5f9
color15              #ffffff

# Настройка вкладок
tab_bar_style        powerline
active_tab_foreground   #0e141b
active_tab_background   #10b981
inactive_tab_foreground #94a3b8
inactive_tab_background #1e293b
